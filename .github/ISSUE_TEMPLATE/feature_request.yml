name: Feature request
description: Suggest a new capability, enhancement, or improvement.
title: "[Feature]: "
labels: [enhancement]

body:
  - type: markdown
    attributes:
      value: |
        Search existing requests first. Describe the workflow you need and include an example when possible.

  - type: input
    id: affected_resource
    attributes:
      label: Affected area (if applicable)
      description: Identify the component or area this request relates to.
      placeholder: "Component name or file path"

  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What task is difficult today, and who would benefit?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe what you would like to happen and any relevant requirements or constraints.
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: Example usage and expected result
      description: Show a usage scenario and what success looks like.
      placeholder: |
        Usage: ...
        Expected result: ...

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and context
      description: Include existing approaches, tradeoffs, or useful references.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for similar requests.
          required: true
