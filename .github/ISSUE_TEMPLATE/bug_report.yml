name: Bug report
description: Report a bug or unexpected behavior in any part of the repository.
title: "[Bug]: "
labels: [bug]

body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Remove secrets and private repository content from prompts, logs, and examples.

  - type: input
    id: affected_resource
    attributes:
      label: Affected area
      description: Identify the component, command, file path, or page involved.
      placeholder: "Component name, command, or file path"
    validations:
      required: true

  - type: input
    id: revision
    attributes:
      label: Repository revision
      description: Commit hash or the date you downloaded the affected files, if known.
      placeholder: "Commit hash or download date"

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include relevant software versions, operating system, configuration, and setup details.
      placeholder: "OS, tool versions, installation method, or workflow URL"

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide minimal steps, relevant inputs or commands, and the starting state needed to reproduce the problem.
      placeholder: |
        1. Set up...
        2. Run or open...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened, and can you reproduce it consistently or only sometimes?
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Supporting evidence
      description: Add relevant output, logs, screenshots, or links, if available.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for this problem.
          required: true
