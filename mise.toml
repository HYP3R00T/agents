[tools]
gitleaks = "latest"
prek = "latest"
rumdl = "latest"
shellcheck = { version = "latest", os = ["linux", "macos"] }
uv = "latest"

[settings]
experimental = true
lockfile = true

[settings.github]
use_git_credentials = true

[hooks]
enter = { run = "bash ./scripts/enter_project.sh" }

[env]
_.file = ".env"  # for sensitive data

[tasks.docs]
description = "Serve the documentation locally"
run = "uvx zensical serve"
