[project]
name = "agentsyncer"
version = "0.1.0"
description = "Sync agent configurations across AI tools using a single source of truth"
readme = "README.md"
authors = [{ name = "Rajesh Das", email = "hyperoot.tech@proton.me" }]
requires-python = ">=3.13"
dependencies = [
    "typer>=0.24.1",
]

[project.scripts]
agentsyncer = "agentsyncer:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"
